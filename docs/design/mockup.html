<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Amethyst — compact</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:default;text-align:inherit}
input{font:inherit;color:inherit;background:none;border:0;outline:0;min-width:0}
.ctl{display:flex;align-items:center;gap:14px;font-size:12px;margin-bottom:10px;color:var(--muted-foreground,#888)}
.seg{display:flex;border-radius:7px;padding:2px;background:color-mix(in srgb,currentColor 12%,transparent)}
.seg button{padding:2px 10px;border-radius:5px}
.seg button.on{background:color-mix(in srgb,currentColor 22%,transparent);color:var(--foreground,#ddd)}
.ctl label{display:flex;gap:6px;align-items:center}
.hint{margin-left:auto}
.stage{position:relative;width:100%;overflow:hidden;border-radius:var(--radius,10px)}
.desk{position:absolute;left:0;top:0;width:1080px;height:692px;transform-origin:0 0;
  background:radial-gradient(55% 65% at 14% 20%,#3d4a5c,transparent 70%),radial-gradient(50% 60% at 88% 85%,#53433a,transparent 70%),radial-gradient(35% 45% at 55% 8%,#2b3b3d,transparent 70%),#16181c}
.desk.lt{background:radial-gradient(55% 65% at 14% 20%,#c4d1e3,transparent 70%),radial-gradient(50% 60% at 88% 85%,#ead8c8,transparent 70%),radial-gradient(35% 45% at 55% 8%,#cfe0dc,transparent 70%),#dfe1e7}

.win{--bg:#0f0f11;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--text:#ececef;--muted:#8e8e97;--faint:#5e5e67;
  --hover:rgba(255,255,255,.04);--sel:rgba(255,255,255,.075);--chip:rgba(255,255,255,.055);
  --on:#85858e;--side:rgba(32,32,37,.6);--glass:rgba(30,30,34,.74);--warn:#d8b45e;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  position:absolute;left:40px;top:36px;width:1000px;height:620px;border-radius:12px;overflow:hidden;display:flex;color:var(--text);
  box-shadow:0 0 0 .5px rgba(0,0,0,.75),0 24px 70px rgba(0,0,0,.5)}
.win.lt{--bg:#fff;--line:rgba(0,0,0,.075);--line2:rgba(0,0,0,.13);--text:#1c1c1f;--muted:#6b6b73;--faint:#a2a2a9;
  --hover:rgba(0,0,0,.035);--sel:rgba(0,0,0,.06);--chip:rgba(0,0,0,.045);
  --on:#8c8c94;--side:rgba(238,238,242,.62);--glass:rgba(250,250,252,.8);--warn:#a8781c;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 24px 70px rgba(0,0,0,.18)}
.win::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.11);pointer-events:none;z-index:60}
.win.lt::after{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.7)}
.mono{font-family:var(--mono);font-size:11.5px}
.sp{flex:1}

/* sidebar */
.side{width:212px;flex:none;display:flex;flex-direction:column;padding:0 8px 8px;background:var(--side);
  backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border-right:1px solid var(--line)}
.lights{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding-left:12px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.search{display:flex;align-items:center;gap:7px;height:28px;margin:0 2px 8px;padding:0 5px 0 8px;border-radius:7px;background:var(--chip);color:var(--faint);font-size:12.5px;box-shadow:inset 0 0 0 .5px var(--line)}
.search span{flex:1}
kbd{font:500 10.5px -apple-system,system-ui,sans-serif;color:var(--faint);padding:1px 5px;border-radius:4px;box-shadow:inset 0 0 0 .5px var(--line2)}
.nav{position:relative;flex:1;overflow:auto}
.ind{position:absolute;left:0;right:0;top:0;height:26px;border-radius:6px;background:var(--sel);transition:transform var(--spm) var(--sp)}
.item{position:relative;display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;border-radius:6px;white-space:nowrap}
.item>svg{color:var(--muted);flex:none}
.item.on>svg{color:var(--text)}
.item:not(.on):hover{background:var(--hover)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .r{font:10.5px var(--mono);color:var(--faint)}
.sec{display:flex;align-items:center;justify-content:space-between;height:28px;margin-top:10px;padding:0 2px 0 8px;font-size:11px;font-weight:600;color:var(--faint)}
.acct{display:flex;align-items:center;gap:9px;margin:6px -8px -8px;padding:8px 8px 8px 14px;border-top:1px solid var(--line)}
.av{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--sel);color:var(--muted);box-shadow:inset 0 0 0 .5px var(--line2)}
.acct div{flex:1;min-width:0;line-height:1.25}.acct b{font-size:12.5px;font-weight:500;display:block}.acct small{font-size:11px;color:var(--faint)}

.ib{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:7px;color:var(--muted);position:relative}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.sm{width:20px;height:20px;border-radius:5px}
.badge{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1.5px var(--bg)}

.tile{position:relative;display:block;width:16px;height:16px;flex:none;border-radius:4px;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14)}
.lt .tile::after{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.tile canvas{display:block}
.tile.t28{width:28px;height:28px;border-radius:7px}
.tile.t18{width:18px;height:18px;border-radius:5px}
.tile.t32{width:32px;height:32px;border-radius:8px}

/* main */
.main{flex:1;min-width:0;position:relative;background:var(--bg)}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.tb{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px}
.tb.ln{border-bottom:1px solid var(--line)}
.ttl{font-size:13.5px;font-weight:600}
.idt{display:flex;align-items:center;gap:10px;min-width:0;margin-right:8px}
.idt b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.idt small{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.body{flex:1;min-height:0;position:relative}
.scroll{overflow:auto}

.play{position:relative;flex:none;height:28px;width:74px;margin-left:4px;border-radius:8px;overflow:hidden;background:var(--text);color:var(--bg);font-weight:600;font-size:12.5px;
  transition:width var(--spm) var(--sp),background-color .2s,color .2s,box-shadow .2s}
.play.busy{width:236px;background:var(--chip);color:var(--text);box-shadow:inset 0 0 0 .5px var(--line2)}
.play.run{width:112px;background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.play canvas{position:absolute;left:0;top:0;opacity:0;transition:opacity .2s}
.play.busy canvas{opacity:1}
.lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:opacity .18s,filter .18s,transform .18s}
.lb.off{opacity:0;filter:blur(3px);transform:translateY(4px);pointer-events:none}
.lb.bz{justify-content:space-between;padding:0 11px;font-weight:500}
.lb.bz .mono{color:var(--muted)}
.dot{position:relative;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid var(--accent);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.5);opacity:.9}to{transform:scale(1.6);opacity:0}}
.lb .stop{margin-left:4px;padding-left:8px;border-left:1px solid var(--line2);color:var(--muted);display:flex}

.tabs{height:36px;flex:none;display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);position:relative}
.tab{position:relative;z-index:1;height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--muted)}
.tab:hover,.tab.on{color:var(--text)}
.tab .n{font:10.5px var(--mono);color:var(--faint)}
.tind{position:absolute;left:0;top:5px;height:26px;border-radius:6px;background:var(--sel);transition:transform var(--spm) var(--sp),width var(--spm) var(--sp)}
.pane{position:absolute;inset:0;overflow:auto;display:none}
.pane.on{display:block}

.pad{padding:14px 16px 18px;display:grid;gap:12px;align-content:start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px}
.st{padding:12px 14px 11px;display:grid;gap:9px}
.st+.st{border-left:1px solid var(--line)}
.st .v{display:flex;align-items:baseline;gap:3px;font-size:19px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:21px;height:21px}
.st .u{font-size:11.5px;font-weight:400;letter-spacing:0;color:var(--muted)}
.st .l{font-size:11.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}
.stack{display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card h4{display:flex;justify-content:space-between;align-items:center;height:32px;padding:0 12px;font-size:11.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.card h4 span{font:10.5px var(--mono);color:var(--faint)}
.row{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 12px;font-size:12.5px}
.row+.row{border-top:1px solid var(--line)}
.row .m{color:var(--muted);font-size:11.5px;white-space:nowrap}
.row .k{width:76px;flex:none;color:var(--muted);font-size:11.5px}
.row .tx{flex:1;min-width:0;line-height:1.25}
.row .tx b{display:block;font-weight:500}
.row .tx small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.hv:hover{background:var(--hover)}
.row.tall{min-height:46px}
.thumb{width:52px;height:30px;border-radius:5px;overflow:hidden;flex:none;position:relative}
.thumb::after,.shot::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.lt .thumb::after,.lt .shot::after{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
em{font-style:normal;color:var(--accent)}

.fbar{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px 0 16px}
.filter{display:flex;align-items:center;gap:6px;width:190px;height:26px;padding:0 8px;border-radius:6px;background:var(--chip);color:var(--faint);font-size:12px;box-shadow:inset 0 0 0 .5px var(--line)}
.filter input{flex:1;color:var(--text)}
.filter input::placeholder{color:var(--faint)}
.chip{height:24px;padding:0 9px;border-radius:6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.chip span{font:10.5px var(--mono);color:var(--faint)}
.chip.on{background:var(--sel);color:var(--text)}
.chip.ol{box-shadow:inset 0 0 0 .5px var(--line2)}
.btn{height:26px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;box-shadow:inset 0 0 0 .5px var(--line2)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--text);color:var(--bg);box-shadow:none}
.th,.tr{display:grid;grid-template-columns:34px minmax(0,1fr) 150px 86px 64px;align-items:center;padding:0 12px 0 16px}
.th{position:sticky;top:0;z-index:2;height:28px;font-size:11px;color:var(--faint);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6)}
.tr{height:32px;font-size:12.5px;border-bottom:1px solid var(--line)}
.tr:hover{background:var(--hover)}
.tr .mn{display:flex;align-items:center;gap:9px;min-width:0}
.tr .mn b{font-weight:500;white-space:nowrap}
.tr .au{color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .ver,.tr .dt{color:var(--muted)}
.tr .src{color:var(--muted);font-size:11.5px}
.tr.off .mn,.tr.off .ver{opacity:.42}
.sw{position:relative;width:24px;height:14px;border-radius:7px;background:var(--chip);box-shadow:inset 0 0 0 .5px var(--line2);transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--faint);transition:transform var(--spm) var(--sp),background .2s}
.sw.on{background:var(--on);box-shadow:none}
.sw.on::after{background:var(--bg);transform:translateX(10px)}

.shots{padding:14px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px}
.shot{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:16/9}
.shot canvas{width:100%!important;height:100%!important;image-rendering:pixelated}
.cap{font-size:11px;color:var(--faint);margin-top:5px;font-variant-numeric:tabular-nums}
.log{padding:12px 16px;font:11.5px/1.75 var(--mono);color:var(--muted);white-space:pre}
.log .t{color:var(--faint)}.log .w{color:var(--warn)}

.dsearch{display:flex;align-items:center;gap:8px;width:360px;height:30px;padding:0 10px;border-radius:8px;background:var(--chip);color:var(--faint);box-shadow:inset 0 0 0 .5px var(--line)}
.dsearch input{flex:1;color:var(--text);font-size:13px}
.res .tx small{max-width:440px}
.res .dl{font:11px var(--mono);color:var(--faint);width:62px;text-align:right}

/* overlays */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s}
.lt .scrim{background:rgba(0,0,0,.08)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:41;display:none;transform-origin:0 0;border-radius:12px;background:var(--glass);
  backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);
  box-shadow:0 0 0 .5px var(--line2),0 18px 50px rgba(0,0,0,.4),inset 0 .5px 0 rgba(255,255,255,.07)}
.lt .sheet{box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 18px 50px rgba(0,0,0,.16)}
.pal{left:240px;top:84px;width:520px}
.pin{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-bottom:1px solid var(--line);color:var(--faint)}
.pin input{flex:1;font-size:14px;color:var(--text)}
.pin input::placeholder{color:var(--faint)}
.plist{padding:6px}
.plist .g{padding:6px 8px 4px;font-size:11px;font-weight:600;color:var(--faint)}
.pi{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:7px;font-size:13px}
.pi svg{color:var(--muted)}
.pi .h{margin-left:auto;font-size:11px;color:var(--faint)}
.pi.on{background:var(--sel)}
.pfoot{display:flex;gap:14px;height:30px;align-items:center;padding:0 14px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
.pop{width:290px}
.pop h5{display:flex;justify-content:space-between;padding:11px 14px 6px;font-size:12px;font-weight:600}
.pop h5 span{font-weight:400;color:var(--faint);font-size:11px}
.dli{padding:8px 14px 10px}
.dli+.dli{border-top:1px solid var(--line)}
.dli .a{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px}
.dli .a span{font:11px var(--mono);color:var(--muted)}
.dli canvas{display:block}
.dli .b{border-radius:2px;overflow:hidden;background:var(--chip)}
.fly{position:absolute;z-index:55;transform-origin:0 0;pointer-events:none}

.win{--accent:#ececef;--accA:rgba(236,236,239,.3)}
.win.lt{--accent:#1c1c1f;--accA:rgba(28,28,31,.22)}
.win[data-acc=ember]{--accent:#ff7b42;--accA:rgba(255,123,66,.4)}
.win.lt[data-acc=ember]{--accent:#e2561a;--accA:rgba(226,86,26,.26)}
.win[data-acc=moss]{--accent:#86c46f;--accA:rgba(134,196,111,.36)}
.win.lt[data-acc=moss]{--accent:#3f8a2e;--accA:rgba(63,138,46,.24)}
.win[data-acc=blue]{--accent:#3b9bff;--accA:rgba(59,155,255,.4)}
.win.lt[data-acc=blue]{--accent:#0a72e8;--accA:rgba(10,114,232,.24)}
</style></head>
<body>
<div class="ctl">
  <div class="seg" id="theme"><button class="on" data-th="dk">Dark</button><button data-th="lt">Light</button></div>
  <div class="seg" id="acc"><button class="on" data-a="">Neutral</button><button data-a="ember">Ember</button><button data-a="moss">Moss</button><button data-a="blue">System blue</button></div>
  <label><input type="checkbox" id="rm"> Reduce motion</label>
  <span class="hint">Try Play, the tabs, the instances, ⌘K and the download button</span>
</div>
<div class="stage" id="stage"><div class="desk" id="desk"><div class="win" id="win"></div></div></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const I={
 home:'<path d="M2.75 7.1 8 2.9l5.25 4.2v5.65c0 .41-.34.75-.75.75H10.1V10H5.9v3.5H3.5a.75.75 0 0 1-.75-.75z"/>',
 compass:'<circle cx="8" cy="8" r="5.75"/><path d="m10.3 5.7-1.25 3.35L5.7 10.3l1.25-3.35z"/>',
 search:'<circle cx="7.1" cy="7.1" r="4.35"/><path d="m10.4 10.4 2.85 2.85"/>',
 plus:'<path d="M8 3.25v9.5M3.25 8h9.5"/>',
 download:'<path d="M8 2.75v7.4M5.1 7.4 8 10.3l2.9-2.9M3.25 13.25h9.5"/>',
 folder:'<path d="M2.75 4.6c0-.47.38-.85.85-.85h2.5l1.4 1.5h4.9c.47 0 .85.38.85.85v5.8c0 .47-.38.85-.85.85H3.6a.85.85 0 0 1-.85-.85z"/>',
 more:'<circle cx="3.75" cy="8" r=".9" fill="currentColor"/><circle cx="8" cy="8" r=".9" fill="currentColor"/><circle cx="12.25" cy="8" r=".9" fill="currentColor"/>',
 sliders:'<path d="M2.75 5h6.5M12.25 5h1M2.75 11h1M6.75 11h6.5"/><circle cx="10.75" cy="5" r="1.5"/><circle cx="5.25" cy="11" r="1.5"/>',
 playf:'<path d="M5 3.6v8.8c0 .4.43.64.77.43l7.05-4.4a.5.5 0 0 0 0-.86L5.77 3.17A.5.5 0 0 0 5 3.6z" fill="currentColor" stroke="none"/>',
 stopf:'<rect x="3.5" y="3.5" width="9" height="9" rx="2" fill="currentColor" stroke="none"/>',
 cube:'<path d="M8 2.6 13 5.3v5.4L8 13.4 3 10.7V5.3zM3 5.3l5 2.7 5-2.7M8 8v5.4"/>',
 globe:'<circle cx="8" cy="8" r="5.75"/><path d="M2.25 8h11.5M8 2.25c1.6 1.6 2.4 3.5 2.4 5.75S9.6 12.15 8 13.75C6.4 12.15 5.6 10.25 5.6 8S6.4 3.85 8 2.25z"/>',
};
const ic=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

// springs → CSS linear()
function spring(k,c){const w=Math.sqrt(k),z=c/(2*w),wd=w*Math.sqrt(Math.max(1e-6,1-z*z));
 const f=t=>z<1?1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t)):1-Math.exp(-w*t)*(1+w*t);
 let T=0;for(let t=0;t<4;t+=1/500)if(Math.abs(1-f(t))>.002)T=t;
 const p=[];for(let i=0;i<=48;i++)p.push(+f(T*i/48).toFixed(4));p[48]=1;
 return{e:`linear(${p.join(',')})`,ms:Math.round(T*1000)}}
const SP=spring(240,24),SPF=spring(420,38);

// ordered dither
const B8=[0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21].map(v=>(v+.5)/64);
function dither(cv,w,h,cell,pal,f){const d=devicePixelRatio||1,cols=Math.ceil(w/cell),rows=Math.ceil(h/cell),W=Math.round(w*d),H=Math.round(h*d);
 if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;cv.style.width=w+'px';cv.style.height=h+'px'}
 const c=cv.getContext('2d'),s=cell*d,n=pal.length-1;c.clearRect(0,0,W,H);
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let t=f((x+.5)/cols,(y+.5)/rows);t=t<0?0:t>1?1:t;
  const v=t*n,i=Math.min(n,Math.floor(v)+((v%1)>B8[(y&7)*8+(x&7)]?1:0)),col=pal[i];
  if(col){c.fillStyle=col;c.fillRect(Math.floor(x*s),Math.floor(y*s),Math.ceil(s),Math.ceil(s))}}
 return cv}
const ramp=(h,s)=>[13,22,33,47,63,80].map(l=>`hsl(${h} ${s}% ${l}%)`);
const F={
 grass:(x,y)=>y<.3?.95-y*.5:.42-(y-.3)*.45+Math.sin(x*11)*.04,
 gear:(x,y)=>{const dx=x-.5,dy=y-.5,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx);return r<.14?.12:1.02-r*1.45+Math.cos(a*8)*.07},

 sky:(x,y)=>y>.68?.3-(y-.68)*.8:.9-y*.55+(Math.hypot(x-.68,y-.3)<.13?.35:0),
