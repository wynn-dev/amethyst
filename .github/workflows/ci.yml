name: CI

# Checks every PR without any secrets: no signing, no notarization, no build-time credentials
# (features that need them degrade gracefully). Signed builds happen in nightly.yml.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # A blank or hung window must fail fast, not hold the runner for hours.
      - name: Smoke test (renderer ↔ main ↔ runtime RPC)
        timeout-minutes: 5
        run: pnpm --filter @amethyst/desktop exec electron .
        env:
          AMETHYST_SMOKE: '1'
      # Catches packaging regressions (missing externalized modules, asar layout) before merge.
      - name: Package (unsigned)
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test (packaged app)
        timeout-minutes: 5
        run: apps/desktop/release/mac-arm64/Amethyst.app/Contents/MacOS/Amethyst
        env:
          AMETHYST_SMOKE: '1'
