<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon: a faceted crystal in flat greys on a near-black macOS rounded square. No gradients. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#121214"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
  <!-- Crown (top) facets -->
  <polygon points="332,330 692,330 592,450 432,450" fill="#d4d4d8"/>
  <polygon points="332,330 432,450 232,450" fill="#f4f4f5"/>
  <polygon points="692,330 592,450 792,450" fill="#a1a1aa"/>
  <!-- Pavilion (bottom) facets -->
  <polygon points="232,450 432,450 512,800" fill="#b4b4bb"/>
  <polygon points="432,450 592,450 512,800" fill="#71717a"/>
  <polygon points="592,450 792,450 512,800" fill="#3f3f46"/>
  <!-- Outline and table edge -->
  <polygon points="332,330 692,330 792,450 512,800 232,450" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="5" stroke-linejoin="round"/>
  <line x1="232" y1="450" x2="792" y2="450" stroke="#ffffff" stroke-opacity="0.3" stroke-width="5"/>
</svg>
