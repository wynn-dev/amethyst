name: Nightly

# Every push to main builds a signed, notarized arm64 app and replaces the contents of the rolling
# `nightly` GitHub release, which is also the electron-updater feed (apps/desktop/electron-builder.yml).
# This workflow only ever touches the `nightly` release and tag.
#
# Two jobs, so the token that can write releases never sits next to the build:
# - `build` runs the checks, signs, notarizes and smoke-tests with a read-only token (and no git
#   credentials on disk), then hands the release files over as an artifact.
# - `publish` holds `contents: write`, checks out nothing and runs no repository code. It updates the
#   release in place, so a run that stops half-way never leaves the feed without a release or
#   without `latest-mac.yml`, and it is never cancelled by a newer push (its own concurrency group).
#
# Actions are pinned by commit SHA (this workflow holds the signing and notarization secrets).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # A manual run from another branch must not publish over main's nightly.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    # A newer push makes this build pointless: cancel it. (Publishing has its own group below.)
    concurrency:
      group: nightly-build
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      RELEASE_DIR: apps/desktop/release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # full history and tags, for "commits since the previous nightly"
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-cache-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Set version
        id: version
        run: |
          # Monotonic semver prerelease: 0.1.0-nightly.9 < 0.1.0-nightly.10 (numeric identifiers).
          VERSION="0.1.0-nightly.${GITHUB_RUN_NUMBER}"
          node -e '
            const fs = require("fs")
            const file = "apps/desktop/package.json"
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
            pkg.version = process.argv[1]
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n")
          ' "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_amethyst.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          AMETHYST_MSA_CLIENT_ID: ${{ secrets.AMETHYST_MSA_CLIENT_ID }}
          AMETHYST_CURSEFORGE_API_KEY: ${{ secrets.AMETHYST_CURSEFORGE_API_KEY }}
          AMETHYST_POSTHOG_KEY: ${{ secrets.AMETHYST_POSTHOG_KEY }}
          AMETHYST_POSTHOG_HOST: https://eu.i.posthog.com
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # forceCodeSigning fails the build instead of silently producing an unsigned app.
        # electron-builder flips the Electron fuses, signs, notarizes the .app with notarytool and
        # staples the ticket. buildVersion becomes CFBundleVersion (a plain monotonic integer).
        working-directory: apps/desktop
        run: node scripts/dist.mjs -c.forceCodeSigning=true -c.buildVersion="$GITHUB_RUN_NUMBER"

      - name: Notarize and staple the dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Apple's notarization/ticket services (CloudKit) occasionally drop connections; retry them.
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "::warning::attempt $i failed: $*"; sleep $((i * 15)); done; return 1; }
          xcrun notarytool submit "$RELEASE_DIR/Amethyst-arm64.dmg" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m
          retry xcrun stapler staple "$RELEASE_DIR/Amethyst-arm64.dmg"

      - name: Remove the App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey_amethyst.p8"

      - name: Verify signature, notarization, Gatekeeper and fuses
        run: |
          # Apple's notarization/ticket services (CloudKit) occasionally drop connections; retry them.
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "::warning::attempt $i failed: $*"; sleep $((i * 15)); done; return 1; }
          APP="$RELEASE_DIR/mac-arm64/Amethyst.app"
          DMG="$RELEASE_DIR/Amethyst-arm64.dmg"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --entitlements - "$APP"
          retry spctl -a -vv "$APP"
          retry xcrun stapler validate "$APP"
          retry xcrun stapler validate "$DMG"
          retry spctl -a -t open --context context:primary-signature -vv "$DMG"
          # The zip is what the updater installs: make sure it holds the same signed app.
          mkdir -p "$RUNNER_TEMP/zipcheck"
          ditto -x -k "$RELEASE_DIR/Amethyst-arm64-mac.zip" "$RUNNER_TEMP/zipcheck"
          codesign --verify --deep --strict "$RUNNER_TEMP/zipcheck/Amethyst.app"
          retry spctl -a -vv "$RUNNER_TEMP/zipcheck/Amethyst.app"
          # The fuses electron-builder.yml asks for (RunAsNode off, asar-only with integrity…).
          FUSES="$(pnpm dlx @electron/fuses@1.8.0 read --app "$PWD/$APP")"
          echo "$FUSES"
          for fuse in 'RunAsNode is Disabled' 'EnableNodeOptionsEnvironmentVariable is Disabled' \
            'EnableNodeCliInspectArguments is Disabled' 'EnableEmbeddedAsarIntegrityValidation is Enabled' \
            'OnlyLoadAppFromAsar is Enabled' 'EnableCookieEncryption is Enabled'; do
            grep -qF "$fuse" <<<"$FUSES" || { echo "::error::expected fuse: $fuse"; exit 1; }
          done

      # A packaged app runs the smoke check only with --amethyst-smoke as well as the variable (main/flags.ts).
      - name: Smoke test the signed app
        timeout-minutes: 5
        env:
          AMETHYST_SMOKE: '1'
        run: '"$RELEASE_DIR/mac-arm64/Amethyst.app/Contents/MacOS/Amethyst" --amethyst-smoke'

      - name: Write release notes
        run: |
          PREV="$(git rev-list -n 1 refs/tags/nightly 2>/dev/null || true)"
          {
            echo "Rolling nightly build of \`main\` at ${GITHUB_SHA::7}, version \`$VERSION\`."
            echo
            echo "**[Download Amethyst-arm64.dmg](https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/Amethyst-arm64.dmg)** for macOS 13 or later on Apple Silicon. Installed copies update themselves."
            echo
            echo "## Changes since the previous nightly"
            echo
            if [ -n "$PREV" ] && git merge-base --is-ancestor "$PREV" HEAD; then
              LOG="$(git log --no-merges --pretty='- %s (%h)' "$PREV..HEAD")"
              echo "${LOG:-No new commits.}"
            else
              echo "The previous nightly could not be found; these are the latest 20 commits."
              echo
              git log --no-merges -n 20 --pretty='- %s (%h)'
            fi
          } > "$RELEASE_DIR/notes.md"
          cat "$RELEASE_DIR/notes.md"

      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nightly"
          cd "$RELEASE_DIR"
          cp Amethyst-arm64.dmg Amethyst-arm64-mac.zip latest-mac.yml ./*.blockmap notes.md "$RUNNER_TEMP/nightly/"
          ls -l "$RUNNER_TEMP/nightly"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-release
          path: ${{ runner.temp }}/nightly/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never cancelled half-way by a newer push. A newer run's publish waits for this one; a
    # publish still waiting is replaced by the newest one.
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-release
          path: nightly

      - name: Update the nightly release in place
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: nightly
        run: |
          set -euo pipefail
          # Hard-coded on purpose: this job must never touch any other release or tag
          # (for example natives-lwjgl2-*).
          TAG=nightly
          FEED=latest-mac.yml
          ASSETS=(Amethyst-arm64.dmg Amethyst-arm64-mac.zip ./*.blockmap)
          ls -l "${ASSETS[@]}" "$FEED" notes.md

          asset_id() { gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" --jq ".[] | select(.name == \"$1\") | .id"; }

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # First run, or the release was deleted by hand. (If the tag outlived its release,
            # gh reuses it; it is moved to this commit below.)
            gh release create "$TAG" "${ASSETS[@]}" "$FEED" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Nightly $VERSION" --notes-file notes.md
          else
            RELEASE_ID="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
            # The binaries first; each replacement is a single asset, and the release stays up.
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            # The feed last, and without a moment where it is missing: upload the new one under a
            # temporary name, then delete the old one and rename the new one into place.
            cp "$FEED" "$FEED.next"
            OLD_TMP="$(asset_id "$FEED.next")"
            [ -z "$OLD_TMP" ] || gh api -X DELETE "repos/$GH_REPO/releases/assets/$OLD_TMP"
            gh release upload "$TAG" "$FEED.next"
            NEW_ID="$(asset_id "$FEED.next")"
            OLD_ID="$(asset_id "$FEED")"
            [ -z "$OLD_ID" ] || gh api -X DELETE "repos/$GH_REPO/releases/assets/$OLD_ID"
            gh api -X PATCH "repos/$GH_REPO/releases/assets/$NEW_ID" -f name="$FEED" >/dev/null
            gh release edit "$TAG" --title "Nightly $VERSION" --notes-file notes.md --prerelease --latest=false
          fi

          # Move the tag to this commit through the API (no git credentials anywhere).
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Check the updater feed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NAMES="$(gh release view nightly --json assets --jq '.assets[].name')"
          echo "$NAMES"
          for name in latest-mac.yml Amethyst-arm64-mac.zip Amethyst-arm64.dmg; do
            grep -qx "$name" <<<"$NAMES" || { echo "::error::the nightly release has no $name"; exit 1; }
          done
